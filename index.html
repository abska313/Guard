const D=[
{n:200,t:'الأهداف العامة والتأكيد المعقول',q:'لماذا يُعد التأكيد المعقول مستوى عالياً من التأكيد وليس مطلقاً؟',
o:['لوجود قيود ملازمة للتدقيق، فمعظم أدلة التدقيق مقنعة أكثر منها قطعية','لأن المدقق مسؤول أيضاً عن اكتشاف التحريفات غير الجوهرية','لأن التدقيق يعفي الإدارة من مسؤولياتها فيقل مستوى التأكيد','لأن المدقق لا يستخدم مفهوم الأهمية النسبية'],
e:'التأكيد المعقول هو أعلى مستوى ممكن من التأكيد، ويتحقق بتخفيض خطر التدقيق إلى مستوى منخفض مقبول. وهو ليس مطلقاً لوجود قيود ملازمة للتدقيق، أهمها أن معظم الأدلة مقنعة لا قطعية. الهدف العام: تعزيز ثقة المستخدمين برأي المدقق في عدالة القوائم المالية من جميع النواحي الجوهرية.'},
{n:210,t:'الاتفاق على شروط ارتباطات التدقيق',q:'طلبت الإدارة تغيير شروط ارتباط التدقيق دون مبرر معقول. ما موقف المدقق؟',
o:['لا يقبل التغيير، وينسحب من الارتباط إن أمكن مع مراعاة الأنظمة واللوائح','يقبل التغيير لأن الإدارة هي صاحبة الشأن','يقبل التغيير شفوياً دون الحاجة لتسجيله','يكمل التدقيق دون الالتفات لشروط الارتباط'],
e:'لا يقبل المدقق التغيير ما لم توجد مبررات معقولة، وعند قبوله تُسجَّل الشروط الجديدة في خطاب الارتباط. وإن لم يوافق ولم تسمح له الإدارة بمواصلة الارتباط الأصلي فإنه ينسحب إن أمكن، ويحدد هل عليه التزامات بإخطار المكلفين بالحوكمة أو الملاك أو جهات أخرى.'},
{n:220,t:'رقابة الجودة لتدقيق البيانات المالية',q:'من يتحمل مسؤولية الجودة الشاملة لكل ارتباط تدقيق يُكلَّف به؟',
o:['الشريك المسؤول عن الارتباط','فاحص رقابة جودة الارتباط','أحدث أعضاء فريق الارتباط','إدارة المنشأة الخاضعة للتدقيق'],
e:'يتحمل الشريك المسؤول عن الارتباط مسؤولية الجودة الشاملة؛ فيبقى متيقظاً لأدلة عدم التزام الفريق بالمتطلبات الأخلاقية، ويتوصل لاستنتاج عن الاستقلال، ويقتنع بإجراءات قبول العملاء وكفاءة الفريق. أما فاحص رقابة الجودة فتُناقَش معه الأمور الجوهرية والأحكام المهمة قبل صياغة التقرير.'},
{n:230,t:'توثيق أعمال التدقيق',q:'ما معيار كفاية أوراق التدقيق؟',
o:['أن تمكّن مدققاً خبيراً لا صلة سابقة له بالتدقيق من فهم طبيعة الإجراءات وتوقيتها ومداها','أن تتضمن نسخاً من جميع سجلات العميل','أن يفهمها الشريك المسؤول فقط','أن تكون كثيرة العدد قدر الإمكان'],
e:'يجب أن تكفي الأوراق ليفهم مدقق خبير، ليس له صلة سابقة بالتدقيق، طبيعة الإجراءات وتوقيتها ومداها ونتائجها وأدلتها وأحكامها المهنية المهمة. ويجمّع المدقق الملف النهائي في وقت مناسب هو 60 يوماً بعد تاريخ التقرير، ولا يحذف أوراقاً قبل انتهاء مدة الاحتفاظ بها.'},
{n:240,t:'مسؤوليات المدقق المتعلقة بالاحتيال',q:'لماذا يُعد خطر عدم اكتشاف التحريف الناتج عن الاحتيال أعلى منه عن الخطأ؟',
o:['لأن الاحتيال قد ينطوي على تواطؤ وتزوير وحذف متعمد وتجاوز للرقابة','لأن المدقق هو المسؤول الأول عن منع الاحتيال','لأن الاحتيال ينشأ دائماً من أخطاء حسابية','لأن خبرة المدقق السابقة تغني عن الشك المهني'],
e:'الفارق بين الاحتيال والخطأ هو أن الإجراء المسبِّب متعمد أو غير متعمد. المسؤولية الأساسية عن منع الاحتيال واكتشافه تقع على الإدارة والمكلفين بالحوكمة، أما المدقق فيحصل على تأكيد معقول ويلتزم بالشك المهني مهما كانت خبرته السابقة بنزاهة الإدارة، ويحصل على إقرارات مكتوبة منها.'},
{n:250,t:'مراعاة القوانين والأنظمة',q:'منعت الإدارة المدقق من الحصول على أدلة كافية لتقييم حدوث عدم التزام قد يكون جوهرياً. ماذا يصدر؟',
o:['رأياً متحفظاً أو يمتنع عن إبداء الرأي (وفق ISA 705)','رأياً غير معدل لأن الالتزام بالأنظمة مسؤولية الإدارة وحدها','رأياً غير معدل مع فقرة أمر آخر','يتجاهل الأمر لأنه لا يتعلق مباشرة بالمبالغ'],
e:'عند منع الإدارة أو المكلفين بالحوكمة المدقق من الحصول على أدلة كافية لتقييم عدم التزام يحتمل أن يكون جوهرياً، يصدر رأياً متحفظاً أو يمتنع عن إبداء الرأي وفق ISA 705. وعليه أيضاً تحديد مسؤوليته عن التقرير عن عدم الالتزام لأطراف خارج المنشأة، علماً أن منع عدم الالتزام واكتشافه مسؤولية الإدارة.'},
{n:260,t:'الاتصال بالمكلفين بالحوكمة',q:'متى يجب أن يكون اتصال المدقق بالمكلفين بالحوكمة كتابياً؟',
o:['بالنتائج المهمة إذا كان الاتصال الشفوي غير كافٍ، وبما يتعلق باستقلاله حين يُطلب ذلك','في كل أمر ظهر أثناء التدقيق دون استثناء','لا يكون كتابياً أبداً','فقط عند اكتشاف احتيال'],
e:'يبلّغ المدقق المكلفين بالحوكمة كتابةً بالنتائج المهمة إذا رأى بحكمه المهني أن الاتصال الشفوي غير كافٍ، وكتابةً بما يتعلق باستقلاله عند الطلب (كالمنشآت المدرجة). وليس ضرورياً تضمين الاتصالات المكتوبة جميع الأمور. ويشمل الاتصال: مسؤوليات المدقق، النطاق والتوقيت، الجوانب النوعية للممارسات المحاسبية، والصعوبات المهمة.'},
{n:265,t:'إبلاغ أوجه القصور في الرقابة الداخلية',q:'ما الذي يقتصر عليه التبليغ المكتوب عن أوجه القصور في الرقابة الداخلية؟',
o:['القصور الذي تعرف عليه المدقق أثناء التدقيق واستنتج أن له أهمية كافية تجعله جديراً بالتقرير','جميع أوجه القصور الممكنة حتى غير المكتشفة','رأي المدقق في فعالية الرقابة الداخلية','القصور الذي أُبلغ شفوياً فقط'],
e:'يقتصر التبليغ على أوجه القصور التي تعرف عليها المدقق أثناء التدقيق واستنتج أن لها أهمية كافية. ويوضح فيه أن غرض التدقيق إبداء رأي في القوائم المالية، وأن فهم الرقابة الداخلية لتصميم إجراءات مناسبة لا لإبداء رأي في فعاليتها. ويكون كتابةً وفي الوقت المناسب، وقد يُتجنب إبلاغ الإدارة مباشرة إذا ثارت شكوك في نزاهتها.'},
{n:300,t:'التخطيط لتدقيق البيانات المالية',q:'كيف يُوصَف التخطيط للتدقيق وفق المعيار 300؟',
o:['عملية مستمرة ومتكررة تبدأ بعد إكمال تدقيق الفترة السابقة وتستمر حتى إكمال الارتباط الحالي','مرحلة منفصلة تنتهي قبل بدء التدقيق','مهمة يقوم بها مساعد المدقق وحده','نشاط لا يتغير بعد وضعه'],
e:'التخطيط ليس مرحلة منفصلة بل عملية مستمرة ومتكررة. يتضمن وضع الاستراتيجية العامة وتطوير خطة التدقيق (وهي الأكثر تفصيلاً)، ويحدّثهما المدقق خلال الارتباط. يشارك فيه الشريك المسؤول والأعضاء الرئيسون، وتبدأ أنشطته المبدئية باستمرار العلاقة مع العميل وتقييم الاستقلال وفهم شروط الارتباط.'},
{n:315,t:'تقدير مخاطر التحريف الجوهري',q:'أي مما يلي من إجراءات تقدير المخاطر في المعيار 315؟',
o:['الاستفسارات والإجراءات التحليلية والملاحظة والتقصي','المصادقات الخارجية وحضور الجرد الفعلي','اختبارات التفاصيل والإجراءات التحليلية الأساسية','إعادة الاحتساب وإعادة الأداء فقط'],
e:'تهدف إلى فهم المنشأة وبيئتها (ومنها الرقابة الداخلية) للتعرف على مخاطر التحريف الجوهري وتقديرها عند مستوى القوائم ومستوى الإقرار، لتكون أساس تصميم الاستجابات. تشمل الاستفسارات من الإدارة والتدقيق الداخلي وآخرين، والإجراءات التحليلية، والملاحظة والتقصي. وتتطلب المخاطر المهمة (ومنها خطر الاحتيال) اعتبارات خاصة.'}
];

["عند التعرف على تحريف جوهري بسبب الاحتيال، ما الذي يجب على المدقق؟","تقييم انعكاساته على جوانب التدقيق الأخرى وإبلاغ المستوى الإداري المناسب في الوقت المناسب","إخفاؤه لحماية العميل","الانتظار حتى نهاية الارتباط","تعديل تقرير الفترة السابقة","ويحدد هل عليه مسؤولية قانونية للتقرير لطرف خارج المنشأة تبطل واجب السرية."]],
[["أي مما يلي من سياسات الإدارة لمنع عدم الالتزام بالأنظمة واكتشافه؟","الاحتفاظ بسجل للأنظمة المهمة وتدريب العاملين على قواعد السلوك","تحديد الأهمية النسبية","إصدار رأي في القوائم","اختيار العينات","وكذلك تصميم رقابة داخلية مناسبة، ومتابعة الالتزام باتخاذ إجراءات تأديبية، وإشراك مستشارين قانونيين."],
["على أي الأنظمة يحصل المدقق على أدلة كافية عن الالتزام بها؟","التي لها تأثير مباشر على تحديد المبالغ الجوهرية والإفصاحات في البيانات المالية","جميع الأنظمة دون استثناء","الأنظمة الأجنبية فقط","الأنظمة التي لا علاقة لها بالقوائم","أما الأنظمة الأخرى فينفذ إجراءات محددة (كالاستفسار من الإدارة) للمساعدة في التعرف على عدم الالتزام بها."],
["عند التعرف على عدم التزام أو الشك فيه، ما الذي يفعله المدقق؟","يفهم طبيعة التصرف وظروفه، ويناقشه مع الإدارة والمكلفين، ويقيّم أثره على رأيه","يتجاهله إن كان صغيراً","يخبر العميل لتصحيحه سراً","ينسحب مباشرة دون تقييم","وقد يحصل على مشورة قانونية إذا لم تتوفر معلومات كافية تؤيد التزام المنشأة."]],
[["ما فائدة الاتصال المتبادل الفعال بين المدقق والمكلفين بالحوكمة؟","يساعد على فهم الأمور المرتبطة بالتدقيق وبناء علاقة عمل بناءة مع الحفاظ على الاستقلالية والموضوعية","يلغي حاجة المدقق لأدلة التدقيق","ينقل مسؤولية الرأي للمكلفين","يخفض أتعاب التدقيق","كما يساعد المكلفين على الإشراف على التقرير المالي وتخفيض مخاطر الأخطاء الجوهرية."],
["أي مما يلي من الصعوبات المهمة التي يُبلغ عنها المكلفون بالحوكمة؟","قيود مفروضة على المدقق من الإدارة وتأخيرات مهمة في توفير المعلومات","ارتفاع أتعاب المدقق","اختلاف شكل التقارير","زيادة عدد الموظفين","ومنها اختصار الوقت دون مبرر وجهد غير متوقع للحصول على الأدلة وعدم إتاحة المعلومات المتوقعة."],
["إذا لم يكن الاتصال المتبادل كافياً لغرض التدقيق، ماذا يفعل المدقق؟","يقيّم أثر ذلك على تقدير مخاطر الأخطاء الجوهرية وقدرته على جمع الأدلة ويتخذ التصرف المناسب","يتجاهل الأمر","ينسحب فوراً","يعدل تقريره دائماً","ويتواصل مع المكلفين في الوقت المناسب بحسب الحال."]],
[["أي مما يلي يأخذه المدقق في الحسبان عند تقرير أن القصور مهم؟","احتمال أن يؤدي إلى تحريفات مستقبلية، وقابلية الأصل للخسارة أو الاحتيال، وتفاعله مع أوجه قصور أخرى","شكل التقارير","عدد العاملين في المحاسبة فقط","حجم أتعاب المدقق","ومنها أيضاً أهمية أدوات الرقابة للتقرير المالي، وسبب وتكرار الاستثناءات المكتشفة."],
["ما المستوى الإداري المناسب لإبلاغه بأوجه القصور المهمة؟","من عليه المسؤولية وله صلاحية تقييم القصور واتخاذ التصرف التصحيحي (كالمسؤول التنفيذي أو المالي)","أي موظف جديد","المساهم الصغير فقط","فريق التدقيق الخارجي","ويُبلَّغ كتابياً وفي الوقت المناسب بحسب الحال."],
["ما فائدة مناقشة الحقائق والظروف مع الإدارة قبل التبليغ؟","تمكّن المدقق من الحصول على معلومات أخرى مناسبة لمزيد من الاهتمام","لإقناع الإدارة بتغيير الرأي","لتأجيل التقرير","لتخفيض الأتعاب","كفهم الإدارة للأسباب الحقيقية أو المشتبه فيها، والتحريفات التي لم تُمنع بأدوات الرقابة، ومؤشر مبدئي لاستجابة الإدارة."]],
[["ما الفرق بين خطة التدقيق والاستراتيجية العامة؟","الخطة أكثر تفصيلاً وتصف طبيعة وتوقيت ومدى إجراءات تقدير الخطر والإجراءات الإضافية","الاستراتيجية أكثر تفصيلاً من الخطة","لا فرق بينهما","الخطة تُكتب بعد التقرير","وتتضمن الخطة أيضاً إجراءات أخرى مطلوبة ليتوافق الارتباط مع المعايير."],
["أي مما يلي تتناوله الاستراتيجية العامة للتدقيق؟","خصائص الارتباط وأهداف التقرير وتوقيته والعوامل المهمة وطبيعة الموارد المتاحة","نتائج التدقيق النهائية","رأي المدقق في الرقابة","قائمة بالأخطاء المصححة","ومن العوامل: الأهمية النسبية، ونتائج التدقيق السابق، وحجم المعاملات، والتطورات المهمة."],
["من يشارك في التخطيط للتدقيق؟","الشريك المسؤول والأعضاء الرئيسون الآخرون، مع مناقشة بين أعضاء الفريق","مساعد المدقق وحده","الإدارة وحدها","المكلفون بالحوكمة وحدهم","وهذا يضمن كفاءة وفعالية عملية التخطيط."]],
[["على أي مستويين يقدر المدقق المخاطر المكتشفة؟","مستوى البيانات المالية ككل ومستوى الإقرار لفئات المعاملات والأرصدة والإفصاحات","مستوى الحسابات البنكية فقط","مستوى العميل ومستوى المورد","مستوى الشريك ومستوى الفريق","وهذا يحدد طبيعة وتوقيت ومدى إجراءات التدقيق الإضافية."],
["أي مما يلي من عناصر فهم المنشأة وبيئتها؟","الصناعة واللوائح وطبيعة المنشأة وسياساتها المحاسبية وأهدافها واستراتيجياتها وقياس أدائها المالي","رأي المدقق السابق فقط","أسماء الموظفين","أتعاب المدقق","وفهم الرقابة الداخلية ذات الصلة: أدوات الرقابة وبيئتها وأنشطتها ونظام المعلومات."],
["عند تحديد ما إذا كان الخطر مهماً، ماذا يفعل المدقق بتأثير أدوات الرقابة المتعلقة بالخطر؟","يستبعد تأثيرها","يعتمد عليها كلياً","يضيف إليها","لا يهتم بالخطر أصلاً","ومن العوامل: كونه خطر احتيال، أو تطورات مهمة، أو تعقد المعاملات، أو معاملات مع أطراف ذات علاقة، أو خارج المسار العادي."],
["ماذا يفعل المدقق إذا ورد أثناء التدقيق معلومات تختلف جوهرياً عما بُني عليه تقدير المخاطر؟","ينقّح التقدير ويعدّل إجراءات التدقيق الإضافية المخططة","يتجاهلها","ينهي الارتباط","يطلب من الإدارة تعديل الأرقام","وذلك حفاظاً على ملاءمة الاستجابات للمخاطر المقدرة."]]
];
const Q=D.map((l,i)=>[l,...X[i].map(a=>({q:a[0],o:a.slice(1,5),e:a[5]}))]);
const A=["...hhhh...","..hhhhhh..","..ssssss..","..skssks..","..ssssss..","...swws...","..bbwrbb..",".bbbbrbbb.",".sbbbrbbs.",".sbbbbbbs.","..bb..bbgg","..kk..kkgg"];
const M=["g..........g",".g........g.","..rrrrrrrr..",".rrwwrrwwrr.",".rrwkrrwkrr.",".rrrrrrrrrr.",".rkwkwkwkwr.",".rrrrrrrrrr.","..rr.rr.rr..",".rr..rr..rr."];
const AC={h:'#3b2314',s:'#f2c28b',k:'#111',b:'#1d4ed8',w:'#fff',r:'#e63946',g:'#ffd23f'};
const MC={r:'#e63946',w:'#fff',k:'#111',g:'#ffd23f'};
const sp=(m,c,p)=>{const s=[];m.forEach((r,y)=>[...r].forEach((k,x)=>{if(c[k])s.push(`${x*p}px ${y*p}px 0 ${c[k]}`)}));return `<div class="sp" style="width:${m[0].length*p}px;height:${m.length*p}px"><i style="display:block;width:${p}px;height:${p}px;box-shadow:${s.join()}"></i></div>`};
let AU,mute=false,S={};
function tone(f,t,d,ty='square',v=.08){if(mute)return;AU=AU||new(window.AudioContext||window.webkitAudioContext)();if(AU.state=='suspended')AU.resume();const o=AU.createOscillator(),g=AU.createGain(),T=AU.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(AU.destination);o.start(T);o.stop(T+d)}
const play={ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.12)),no:()=>[220,165,110].forEach((f,i)=>tone(f,i*.1,.16,'sawtooth')),lose:()=>[392,330,262,196,131].forEach((f,i)=>tone(f,.4+i*.18,.25,'triangle',.12)),win:()=>[523,523,523,659,784,659,784,1047].forEach((f,i)=>tone(f,i*.12,.14))};
const hs=n=>'<span class="h">'+'♥'.repeat(n)+'<i>'+'♥'.repeat(3-n)+'</i></span>';
function start(){app.innerHTML=`<h1 class="title">⚔ حارس التدقيق ⚔</h1>
<div class="px arena" style="height:130px">${sp(A,AC,6)}${sp(M,MC,6)}</div>
<div class="px c">جامعة بابل<br>كلية الإدارة والاقتصاد — قسم المحاسبة<br>إعداد الطالبين: عباس مصطفى و مصطفى لؤي<br><span style="color:var(--gd)">المادة: معايير التدقيق الدولي (من معيار 200 إلى معيار 315)</span></div>
<div class="px c">10 مستويات • 41 سؤالاً • 3 قلوب لكل مستوى • 100 XP لكل إجابة<br>اهزم وحش التحريف المالي بالمعرفة!</div>
<button class="go" data-a="start">ابدأ اللعب ▶</button>`}
function lv(){const L=Q[S.i][S.j];S.o=L.o.map((t,k)=>({t,c:!k})).sort(()=>Math.random()-.5);S.ans=false;
app.innerHTML=`<div class="px bar"><span id="hp">${hs(S.hp)}</span><span>المستوى ${S.i+1}/10 • سؤال ${S.j+1}/${Q[S.i].length}</span><span>XP <b id="xp">${S.xp}</b></span></div>
<div class="px arena"><div id="au">${sp(A,AC,6)}</div><div id="mn"><div style="filter:hue-rotate(${S.i*32}deg)">${sp(M,MC,8)}</div></div></div>
<div class="px"><span class="badge">ISA ${D[S.i].n} — ${D[S.i].t}</span><p style="margin:8px 0">${L.q}</p>${S.o.map((o,k)=>`<button class="op" data-k="${k}">${o.t}</button>`).join('')}</div><div id="dlg"></div>`}
function pick(k){if(S.ans)return;S.ans=true;const L=Q[S.i][S.j],ok=S.o[k].c;
document.querySelectorAll('.op').forEach((x,j)=>{if(S.o[j].c)x.classList.add('ok');else if(j==k)x.classList.add('no');x.classList.add('d')});
if(ok){S.xp+=100;play.ok();$('#mn').classList.add('hit')}else{S.hp--;S.w++;play.no();$('#au').classList.add('hit');app.classList.add('sk');setTimeout(()=>app.classList.remove('sk'),450);if(S.hp<1)play.lose()}
$('#hp').innerHTML=hs(S.hp);$('#xp').textContent=S.xp;
$('#dlg').innerHTML=`<div class="px dlg ${ok?'':'r'}"><b style="color:${ok?'var(--gr)':'var(--rd)'}">${ok?'إجابة صحيحة! +100 XP':'إجابة خاطئة! −1 ♥'}</b>${ok?'':`<p style="margin:4px 0;color:var(--gd)">الصحيح: ${L.o[0]}</p>`}<p style="margin:6px 0;font-weight:400">${L.e}</p><button class="go" data-a="next">${S.hp<1?'انتهت المحاولات':S.j<Q[S.i].length-1?'السؤال التالي ▶':S.i==9?'النتيجة النهائية ▶':'المستوى التالي ▶'}</button></div>`;
$('#dlg').scrollIntoView({behavior:'smooth',block:'nearest'})}
function over(){app.innerHTML=`<h1 class="title" style="color:var(--rd)">GAME OVER</h1><div class="px c">${sp(M,MC,8)}<br>انتصر وحش التحريف! وصلت للمستوى ${S.i+1}<br>XP: ${S.xp}</div><button class="go" data-a="retry">أعد المستوى ↻</button>`}
function win(){play.win();app.innerHTML=`<h1 class="title">🏆 النصر! 🏆</h1><div class="px c">أتممت المستويات العشرة<br><span style="color:var(--gd);font-size:28px">${(n=>'★'.repeat(n)+'☆'.repeat(3-n))(3-Math.min(2,S.w>>2))}</span><br>النقاط: ${S.xp} / ${Q.flat().length*100}</div><div class="px c">جامعة بابل — كلية الإدارة والاقتصاد — قسم المحاسبة<br>عباس مصطفى و مصطفى لؤي</div><button class="go" data-a="start">العب مجدداً ↻</button>`}
document.onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
if(b.dataset.k!==undefined)pick(+b.dataset.k);
else if(a=='start'){S={i:0,j:0,hp:3,xp:0,x0:0,w:0};lv()}
else if(a=='retry'){S.j=0;S.hp=3;S.xp=S.x0;lv()}
else if(a=='next'){if(S.hp<1)over();else if(S.j<Q[S.i].length-1){S.j++;lv()}else if(S.i==9)win();else{S.i++;S.j=0;S.hp=3;S.x0=S.xp;lv()}}
else if(a=='mute'){mute=!mute;b.textContent=mute?'🔇':'🔊'}};
start();
</script>
</body>
</html>
